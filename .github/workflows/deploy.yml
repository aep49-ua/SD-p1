name: Build and push images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { dir: WM_Central, file: Dockerfile, image: wm-central }
          - { dir: WM_WS, file: Dockerfile, image: wm-ws-m }
          - { dir: WM_WS, file: Dockerfile.e, image: wm-ws-e }
          - { dir: WM_FO, file: Dockerfile, image: wm-fo }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.dir }}
          file: ./${{ matrix.dir }}/${{ matrix.file }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
