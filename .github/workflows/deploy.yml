name: Build and push images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [WM_Central, WM_WS, WM_FO]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: name
        run: |
          case "${{ matrix.module }}" in
            WM_Central) echo "image=wm-central" >> "$GITHUB_OUTPUT" ;;
            WM_WS) echo "image=wm-ws" >> "$GITHUB_OUTPUT" ;;
            WM_FO) echo "image=wm-fo" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.module }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ steps.name.outputs.image }}:latest
