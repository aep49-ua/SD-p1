services:
  monitor:
    image: alejandropraats/wm-ws-m:latest
    build: .
    command: ["WM_WS_M", "6001", "${CENTRAL_HOST:?Define CENTRAL_HOST}", "${CENTRAL_PORT:-5000}", "${WS_ID:-WS-01}", "${WS_UBICACION:-River Park}"]
    restart: "no"

  engine:
    image: alejandropraats/wm-ws-e:latest
    build:
      context: .
      dockerfile: Dockerfile.e
    command: ["WM_WS_E", "${BROKER_HOST:?Define BROKER_HOST}", "${BROKER_PORT:-9092}", "monitor", "6001"]
    stdin_open: true
    tty: true
    restart: "no"
